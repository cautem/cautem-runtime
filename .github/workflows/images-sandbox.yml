name: images-sandbox

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "images/**"
      - "cmd/cautem-init/**"
      - "cmd/cautem-supervisor/**"
      - "cmd/cautem-sshd/**"
      - "internal/app/supervisor/**"
      - "internal/app/sshd/**"
      - "sshserver/**"
      - "supervisorcontrol/**"
      - "relaytarget/**"
      - "go.mod"
      - "go.sum"
      - "harden/**"
      - ".github/workflows/images-sandbox.yml"
  pull_request:
    paths:
      - "images/**"
      - "cmd/cautem-init/**"
      - "cmd/cautem-supervisor/**"
      - "cmd/cautem-sshd/**"
      - "internal/app/supervisor/**"
      - "internal/app/sshd/**"
      - "sshserver/**"
      - "supervisorcontrol/**"
      - "relaytarget/**"
      - "go.mod"
      - "go.sum"
      - "harden/**"
      - ".github/workflows/images-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # OpenShell-style: one image name per flavor under …/sandboxes/<name>
  IMAGE_PREFIX: ghcr.io/cautem/cautem/sandboxes
  GOWORK: ${{ github.workspace }}/go.work

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: cli
            name: base
          - target: gui
            name: gui
          - target: gpu
            name: gpu
          - target: gui-gpu
            name: gui-gpu
    steps:
      - name: Checkout cautem-runtime
        uses: actions/checkout@v4
        with:
          path: cautem-runtime
      - name: Checkout cautem-core
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-core
          path: cautem-core
          ref: 3e8578194f94048a5c2619d2e1411eac546de985
      - name: Checkout cautem-driver
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-driver
          path: cautem-driver
          ref: b262a04d463be6d81ec01ea99a2016ec0047cd8f
      - name: Checkout cautem-proxy
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-proxy
          path: cautem-proxy
          ref: dda81bc1d7cf13e403ccbdbd67717d08eb69f98a

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: cautem/slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in cautem-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in cautem-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/cautem/${d} v0.1.0-alpha.1 => ./$d"
                echo "  github.com/cautem/${d} v0.1.6 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/cautem/slogx v0.1.0-alpha.1 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.3 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cautem-*/go.sum
            slogx/go.sum
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime helpers into image context
        working-directory: cautem-runtime
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o images/sandbox/cautem-init ./cmd/cautem-init
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o images/sandbox/cautem-supervisor ./cmd/cautem-supervisor
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o images/sandbox/cautem-sshd ./cmd/cautem-sshd
      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: cautem-runtime/images/sandbox
          file: cautem-runtime/images/sandbox/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
